server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # За Traefik (https, 443) абсолютный редирект ушёл бы на http://…:8080 — отдаём относительный Location
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Хэшированные ресурсы Vite — кэшируем надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Привязка домена к приложению (E2.1-T6): файлы собирает deploy/40-app-links.sh при старте; нет файла — 404
    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /tmp/app-links/assetlinks.json;
    }
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        alias /tmp/app-links/apple-app-site-association;
    }

    # Ссылка в приложение без приложения: пути приложения повторяют сайт, /app/… → /…
    location = /app {
        return 302 /;
    }
    location ^~ /app/ {
        rewrite ^/app(/.*)$ $1 redirect;
    }

    # /api/ обслуживает api-контейнер (маршрут в Traefik). Старые ссылки на фото
    # профиля (/uploads/...) не должны возвращать index.html вместо картинки.
    location /uploads/ {
        return 404;
    }

    # SPA: все остальные пути отдают index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
