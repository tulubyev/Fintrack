# Сборка образов api и web и публикация в GHCR.
# На VPS образы только подтягиваются (docker compose pull), см. deploy.sh.
# Ничего настраивать не нужно: GITHUB_TOKEN выдаётся автоматически.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [api, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/fintrack-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.name }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # подтверждение прав в Яндекс Вебмастере и Search Console (E1.8-T7): переменные репозитория, не секреты —
          # код всё равно виден в HTML; api-образ эти аргументы не использует
          build-args: |
            PUBLIC_YANDEX_VERIFICATION=${{ vars.YANDEX_VERIFICATION }}
            PUBLIC_GOOGLE_VERIFICATION=${{ vars.GOOGLE_VERIFICATION }}
