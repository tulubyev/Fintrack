<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1314" media="(prefers-color-scheme: dark)" />
    <title>FinTrack</title>
    <script>
      // тема до загрузки бандла — без вспышки светлой темы; ключ и значения те же, что у next-themes (src/lib/theme.tsx)
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'cream') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
